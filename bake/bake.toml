[package]
name = "bake"
version = "0.1.0"
type = "executable"

[profile.release]
strip = true

[dependencies]
json = { url = "https://github.com/bake-pkgs/json", tag = "v3.12.2" }
tomlplusplus = { url = "https://github.com/bake-pkgs/tomlplusplus", tag = "v3.4.3" }

[target."*-windows-gnu"]
libraries = ["ole32", "version"]

[language]
cxx = "c++23"
